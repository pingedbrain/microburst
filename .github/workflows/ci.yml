name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create env
        run: uv venv --python ${{ matrix.python }} .venv
      - name: Install
        run: uv pip install --python .venv/bin/python -e ".[test]"
      - name: Lint
        run: .venv/bin/python -m ruff check src/ tests/
      - name: Test
        run: .venv/bin/python -m pytest tests/ -q
