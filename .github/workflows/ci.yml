name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Install
        run: uv pip install --python ${{ matrix.python }} --system -e ".[test]"
      - name: Lint
        run: uvx ruff check src/ tests/
      - name: Test
        run: uv run --python ${{ matrix.python }} --no-project --with-editable . --with pytest --with boto3 python -m pytest tests/ -q
