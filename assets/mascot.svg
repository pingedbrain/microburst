<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <!-- Nimbus, the microburst mascot: a grumpy little storm cloud raining
       lightning on your AWS SDK calls. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="400" height="340" rx="28" fill="url(#sky)"/>

  <!-- cloud body -->
  <g fill="url(#cloud)">
    <circle cx="140" cy="110" r="52"/>
    <circle cx="200" cy="88"  r="62"/>
    <circle cx="262" cy="112" r="50"/>
    <rect x="112" y="98" width="180" height="62" rx="31"/>
  </g>

  <!-- grumpy face -->
  <g stroke="#0f172a" stroke-width="9" stroke-linecap="round" fill="none">
    <!-- angry eyebrows -->
    <path d="M158 92 L186 104"/>
    <path d="M242 92 L214 104"/>
  </g>
  <g fill="#0f172a">
    <circle cx="178" cy="122" r="8"/>
    <circle cx="222" cy="122" r="8"/>
    <!-- frown -->
    <path d="M182 150 Q200 140 218 150" stroke="#0f172a" stroke-width="7"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- lightning bolts: the faults -->
  <g fill="url(#bolt)">
    <polygon points="168,170 152,214 172,214 156,268 196,206 174,206 190,170"/>
    <polygon points="238,176 226,212 242,212 230,252 262,200 244,200 254,176"/>
    <polygon points="112,182 102,212 116,212 106,244 132,200 118,200 128,182"/>
  </g>

  <!-- spark ring where the bolt lands -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="282" x2="162" y2="274"/>
    <line x1="250" y1="282" x2="238" y2="274"/>
    <line x1="200" y1="292" x2="200" y2="278"/>
  </g>
</svg>
