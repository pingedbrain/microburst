[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "microburst"
dynamic = ["version"]
description = "AWS failure injection proxy — protocol-aware faults for any AWS endpoint (emulators or real AWS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pingedbrain", email = "licha.pintos@gmail.com" }]
keywords = ["aws", "chaos", "fault-injection", "resilience", "testing", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "PyYAML>=6.0",
    "botocore>=1.34",
    "jmespath>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "boto3>=1.34",
    "ruff>=0.6",
]
otel = [
    "opentelemetry-api>=1.20",
]

[project.urls]
Homepage = "https://github.com/pingedbrain/microburst"
Repository = "https://github.com/pingedbrain/microburst"
Issues = "https://github.com/pingedbrain/microburst/issues"

[project.scripts]
microburst = "microburst.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/microburst/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/microburst"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
